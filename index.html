<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The 99 beautiful names of Allah (Asmaa-ul-Husna) — Arabic, transliteration, audio recitation, calligraphy, and meanings in 16 languages.">
  <meta name="theme-color" content="#0d0d10">
  <meta property="og:title" content="أسماء الله الحسنى — He Is Allah">
  <meta property="og:description" content="The 99 beautiful names of Allah with audio, calligraphy and translations in 16 languages.">
  <meta property="og:type" content="website">
  <title>أسماء الله الحسنى — He Is Allah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="ornament" aria-hidden="true">
        <span></span><span class="diamond"></span><span></span>
      </div>
      <h1>أسماء الله الحسنى</h1>
      <p class="tagline">The 99 Beautiful Names of Allah</p>
      <div class="controls">
        <input type="search" id="search" placeholder="Search...">
        <select id="lang"></select>
      </div>
    </div>
  </header>

  <main>
    <div id="grid" class="grid" aria-busy="true">
      <div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <div id="detail" class="detail hidden" aria-hidden="true">
    <button class="close" aria-label="Close">&times;</button>
    <div class="detail-inner">
      <div class="detail-bg"></div>
      <div class="detail-content">
        <div class="detail-svg"></div>
        <h2 class="detail-arabic"></h2>
        <p class="detail-translit"></p>
        <audio controls class="detail-audio"></audio>
        <h3 class="detail-short-key"></h3>
        <div class="detail-short-val"></div>
        <h3 class="detail-meaning-key"></h3>
        <div class="detail-meaning-val"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
