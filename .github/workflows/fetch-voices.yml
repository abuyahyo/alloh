name: Fetch missing voice recordings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-voices.yml'
      - 'scripts/fetch-missing-voices.mjs'
      - 'json/names.json'

permissions:
  contents: write

concurrency:
  group: fetch-voices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download missing voice files
        run: node scripts/fetch-missing-voices.mjs

      - name: Commit and push if new voices were downloaded
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voices/
          if git diff --staged --quiet; then
            echo "No new voices to commit."
          else
            git commit -m "Backfill missing voice recordings"
            git push
          fi
