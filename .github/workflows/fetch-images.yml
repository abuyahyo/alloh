name: Fetch missing image assets

# Backfills images/*.svg (and any other images/*.* referenced from
# names.json) from app.isokoon.com whenever names.json or the script
# changes; cron is the safety net.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-images.yml'
      - 'scripts/fetch-missing-images.mjs'
      - 'json/names.json'
  schedule:
    - cron: '29 4 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download missing image assets
        run: node scripts/fetch-missing-images.mjs

      - name: Commit and push if new images were downloaded
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/
          if git diff --staged --quiet; then
            echo "No new image assets to commit."
          else
            git commit -m "Backfill missing image assets"
            git push
          fi
